name: HealthSync
options:
  bundleIdPrefix: com.hmake98
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  HealthSync:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HealthSync
        createIntermediateGroups: true
    info:
      path: HealthSync/Info.plist
      properties:
        CFBundleDisplayName: HealthSync
        NSHealthShareUsageDescription: "HealthSync reads your Apple Health data to display your daily metrics and sync them to your personal health server."
        NSHealthUpdateUsageDescription: "HealthSync may write health data to Apple Health."
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.hmake98.HealthSync.sync
        UILaunchScreen:
          UIColorName: ""
    entitlements:
      path: HealthSync/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmake98.HealthSync
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: HealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthSync/HealthSync.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - sdk: HealthKit.framework
